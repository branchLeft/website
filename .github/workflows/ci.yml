name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every push to main (the only run that publishes) shares one group and runs
# one at a time, oldest first, whole pipeline included: build, scan, attest and
# deploy. cancel-in-progress is false, so a run that has started is never cut
# off; while one runs, only the newest waiting run is kept, which is the one
# that should deploy. A pull-request run gets a group of its own, so it never
# queues behind a deploy. The deploy job also checks that its commit is still
# the tip of main, because arrival order is not commit order.
concurrency:
  group: ${{ github.event_name == 'push' && 'website-production-pipeline' || format('website-ci-{0}', github.run_id) }}
  cancel-in-progress: false

# No id-token: write at the workflow level any more -- nothing in this
# workflow federates to GCP. Production deploys pin a GHCR image digest onto
# app1 over SSH instead (the `deploy` job below); `packages: write` and the
# signing permissions are granted to the `publish` and `attest` jobs there, not
# here.
permissions:
  contents: read
  packages: read

jobs:
  checks:
    name: Typecheck, Pre-commit & Coverage
    runs-on: ubuntu-latest
    # Observed 0.77-1.1min over the last 20 successful runs (p95 1.08min).
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: '@branchleft'

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck
        run: pnpm typecheck

      - name: Setup Python (for pre-commit)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'

      - name: Run pre-commit hooks
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        env:
          SKIP: vitest

      - name: Unit tests with coverage
        run: pnpm test:unit --run --coverage
        env:
          CI: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    # Observed 2.05-2.72min over the last 20 successful runs (p95 2.55min).
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: '@branchleft'

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: End-to-end tests
        run: pnpm test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  docker-build:
    name: docker build (website)
    runs-on: ubuntu-latest
    # Build-only, no credentials -- proves the Dockerfile still builds on
    # every PR and on push, mirroring ghost-platform's mailgun-shim-image.yml
    # split of a credential-free build job and a separate push-and-deploy job.
    # Observed 0.45-0.68min over the last 12 successful runs (p95 0.68min).
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker build \
            --secret id=node_auth_token,env=NODE_AUTH_TOKEN \
            --tag website:ci \
            .

  # The production pipeline on a push to main is four jobs in a fixed order:
  # publish (build, push, resolve the digest) -> scan -> attest -> deploy. Each
  # job holds only the permissions its own steps need, so the one credential
  # that can write to the registry is never in the job that touches app1, and
  # the signing credential is never in the job that builds.
  publish:
    name: Build & push
    runs-on: ubuntu-latest
    needs: [checks, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # packages: write is scoped to this job (and the attest job's registry
    # login) alone, on the one trigger that ever runs it -- a PR build must
    # never sit in the same permissions block as a publish credential
    # (mailgun-shim-image.yml's reasoning, copied here verbatim).
    permissions:
      contents: read
      packages: write
    # Observed 1.42-2.88min over the last 5 successful runs of the combined
    # build-and-deploy job (p95 2.88min) -- small sample (only push-to-main
    # triggers this job), so a wider margin than the p95-driven jobs above.
    timeout-minutes: 15
    env:
      IMAGE: ghcr.io/branchleft/website
      IMAGE_TAG: ${{ github.sha }}
    # The image name and the digest leave this job as outputs so the scan, the
    # attestation and the deploy all act on the one digest pushed here, never
    # on a tag that could move.
    outputs:
      image: ${{ env.IMAGE }}
      digest: ${{ steps.digest.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two tags from one build so `latest` never points at a different layer
      # set than the SHA tag pushed alongside it (mailgun-shim-image.yml's
      # pattern).
      - name: Build and push image
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker build \
            --secret id=node_auth_token,env=NODE_AUTH_TOKEN \
            --tag "$IMAGE:$IMAGE_TAG" \
            --tag "$IMAGE:latest" \
            .
          docker push "$IMAGE" --all-tags

      # branchleft-deploy refuses anything that is not digest-pinned, so a tag
      # is not enough here. `imagetools inspect` has been observed printing a
      # Name:/MediaType:/Digest: block despite --format; the grep yields the
      # bare sha256:... value either way (the same trap shared-infra's
      # RUNBOOK-edge.md documents hitting on 2026-08-22).
      - name: Resolve the pushed image's digest
        id: digest
        run: |
          DIGEST=$(docker buildx imagetools inspect "$IMAGE:$IMAGE_TAG" --format '{{.Manifest.Digest}}' \
            | grep -o 'sha256:[0-9a-f]*' | head -1)
          if [ -z "$DIGEST" ]; then
            echo "::error::could not resolve a digest for $IMAGE:$IMAGE_TAG"
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

  # Grype over a Syft SBOM, against the pushed digest: any critical or high
  # finding that no valid exemption covers fails this job, and with it the
  # attest and deploy jobs that need it. The gate, its exemption file and its
  # limits are the reusable workflow's own; it is pinned to an exact tag, and
  # it reads the website's exemptions from `.image-scan-exemptions.json` when
  # that file exists. The image is passed by digest, and the workflow refuses a
  # tag.
  scan:
    name: Scan the pushed image
    needs: [publish]
    permissions:
      contents: read
      packages: read
    uses: branchLeft/github-workflows/.github/workflows/image-scan.yml@v1.1.0
    with:
      image: ${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}

  # Signs the digest that just passed the scan and proves the signature, in
  # the one shared action (github-workflows' attest-and-verify-image): the
  # attestation, its verify through the GitHub API and from the registry, and
  # the wrong-identity control all live there, and none is copied here. The
  # signer is a literal: read from this run's own `github.workflow_ref` it
  # would agree with itself and prove nothing. This job `needs` the scan, so an
  # image that fails the scan is never signed. id-token and attestations are
  # held by this job alone; it has no checkout and holds no deploy key. A
  # composite action is pinned to the full commit of the v1.1.0 tag (the
  # standards require a 40-character SHA for an action); the reusable scan
  # workflow above is pinned to the tag itself, as docs-lint is.
  attest:
    name: Attest the scanned image
    runs-on: ubuntu-latest
    needs: [publish, scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      packages: write
      id-token: write
      attestations: write
    # No runs observed yet: the action's verify retries total about four
    # minutes at worst, so a bound well above that.
    timeout-minutes: 15
    env:
      IMAGE: ${{ needs.publish.outputs.image }}
      DIGEST: ${{ needs.publish.outputs.digest }}
      SCAN_VERDICT: ${{ needs.scan.outputs.verdict }}

    steps:
      # A second, independent refusal: the scan job already fails on a block,
      # and this fails the attest job if the verdict is anything but PASS
      # (including unset), so a scan that returned without judging the image
      # still cannot lead to a signature.
      - name: Refuse to sign an image the scan did not pass
        run: |
          if [ "$SCAN_VERDICT" != "PASS" ]; then
            echo "::error::the image scan verdict is '$SCAN_VERDICT', not PASS; not attesting $IMAGE@$DIGEST"
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest and verify the pushed image
        uses: branchLeft/github-workflows/.github/actions/attest-and-verify-image@77506b6d4603ef432bbdec734139fec91e5bea47 # v1.1.0
        with:
          image: ${{ env.IMAGE }}
          digest: ${{ env.DIGEST }}
          signer-workflow: branchLeft/website/.github/workflows/ci.yml
          repo: branchLeft/website

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [publish, scan, attest]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: website-production-deploy
      cancel-in-progress: false
    # This job reaches app1 over SSH with a deploy key from a secret and checks
    # nothing out. Its one use of the GitHub token is the read-only tip check
    # below, so it holds contents: read and nothing else.
    permissions:
      contents: read
    # The 15 minutes carried over from the combined build-and-deploy job, which
    # was 1.42-2.88min over its last 5 runs; the deploy steps are the smaller
    # part of that.
    timeout-minutes: 15
    env:
      IMAGE: ${{ needs.publish.outputs.image }}
      DIGEST: ${{ needs.publish.outputs.digest }}

    steps:
      # Runs first, before the deploy key is written. The group above gives
      # arrival order, which is not commit order: a slow older run can reach
      # this job after a newer one. This fails the job (it does not skip) when
      # the commit being deployed is no longer the tip of main, so an older
      # image can never be pinned over a newer one; the newer push's own run
      # deploys. An unreadable tip fails the job too.
      - name: Refuse to deploy a commit that is no longer the tip of main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          TIP=$(gh api "repos/$REPO/commits/main" --jq .sha)
          if [ -z "$TIP" ]; then
            echo "::error::could not read the tip of main; not deploying $GITHUB_SHA"
            exit 1
          fi
          if [ "$TIP" != "$GITHUB_SHA" ]; then
            echo "::error::main has moved on to $TIP; refusing to deploy the older commit $GITHUB_SHA"
            exit 1
          fi

      # The private key never touches disk longer than this job needs it, and
      # never appears in a log: it comes from a secret, not from `run:`
      # interpolation.
      - name: Write the deploy SSH key
        env:
          SSH_KEY: ${{ secrets.HETZNER_APP1_DEPLOY_SSH_KEY }}
        run: |
          install -d -m 0700 ~/.ssh
          umask 077
          printf '%s\n' "$SSH_KEY" > ~/.ssh/app1_deploy_key

      # Pinned rather than TOFU'd: a GitHub-hosted runner has no prior
      # knowledge of app1's host key, and accepting whatever key answers on
      # first connect is exactly the MITM window host-key pinning exists to
      # close.
      - name: Pin app1's host key
        env:
          HETZNER_APP1_SSH_HOST_KEY: ${{ vars.HETZNER_APP1_SSH_HOST_KEY }}
        run: |
          if [ -z "$HETZNER_APP1_SSH_HOST_KEY" ]; then
            echo "HETZNER_APP1_SSH_HOST_KEY is empty or unset -- set the repository variable before deploying" >&2
            exit 1
          fi
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$HETZNER_APP1_SSH_HOST_KEY" >> ~/.ssh/known_hosts

      # The whole of the CI deploy account's privilege: one sudo-permitted
      # binary that validates its own arguments, pins the digest into
      # /etc/branchleft/website.image.env, and restarts branchleft-compose@website
      # (shared-infra's hetzner/provision/branchleft_deploy.py). Nothing here
      # mutates Pulumi state -- there is none left for this stack to mutate.
      - name: Pin app1 to the pushed digest and restart the stack
        env:
          HETZNER_APP1_HOST: ${{ vars.HETZNER_APP1_HOST }}
        run: |
          ssh -i ~/.ssh/app1_deploy_key "deploy@$HETZNER_APP1_HOST" \
            "sudo -n /usr/local/sbin/branchleft-deploy website $IMAGE@$DIGEST"

      # app1's public port is bound to its private address only
      # (deploy/compose.yml) -- nothing listens on loopback, so the check
      # runs on the host itself, over the one SSH account CI holds, against
      # that same private address.
      - name: Smoke test the deployed stack over the private network
        env:
          HETZNER_APP1_HOST: ${{ vars.HETZNER_APP1_HOST }}
        run: |
          check() {
            path="$1"
            for attempt in $(seq 1 10); do
              if ssh -i ~/.ssh/app1_deploy_key "deploy@$HETZNER_APP1_HOST" \
                   "curl -fsS --max-time 10 http://10.20.1.100:8080$path -o /dev/null"; then
                echo "OK: $path"
                return 0
              fi
              echo "Attempt $attempt failed for $path, retrying in 6s..."
              sleep 6
            done
            echo "::error::Smoke test failed: $path did not return a successful response after retries"
            return 1
          }

          check "/"
          check "/about"
          check "/contact"

      - name: Remove the deploy SSH key
        if: always()
        run: rm -f ~/.ssh/app1_deploy_key
