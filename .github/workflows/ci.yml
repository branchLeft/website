name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No id-token: write at the workflow level any more -- nothing in this
# workflow federates to an external cloud. Production deploys pin a GHCR image digest onto
# app1 over SSH instead (the `deploy` job below); `packages: write` for that
# job is granted there, not here.
permissions:
  contents: read
  packages: read

jobs:
  checks:
    name: Typecheck, Pre-commit & Coverage
    runs-on: ubuntu-latest
    # Observed 0.77-1.1min over the last 20 successful runs (p95 1.08min).
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm, Node and dependencies
        uses: ./.github/actions/setup-pnpm-node
        with:
          node-auth-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck
        run: pnpm typecheck

      - name: Setup Python (for pre-commit)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'

      - name: Run pre-commit hooks
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        env:
          SKIP: vitest

      - name: Unit tests with coverage
        run: pnpm test:unit --run --coverage
        env:
          CI: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  e2e:
    name: End-to-end tests
    # ubuntu-latest became 26.04 on 15 Nov 2026; Playwright 1.65's WebKit build
    # needs libicudata.so.74 (24.04) and fails to launch there. Move back to
    # ubuntu-latest once Playwright ships a WebKit build for 26.04.
    runs-on: ubuntu-24.04
    # Observed 2.05-2.72min over the last 20 successful runs (p95 2.55min).
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm, Node and dependencies
        uses: ./.github/actions/setup-pnpm-node
        with:
          node-auth-token: ${{ secrets.GITHUB_TOKEN }}
          playwright: 'true'

      - name: End-to-end tests
        run: pnpm test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  docker-build:
    name: docker build (website)
    runs-on: ubuntu-latest
    # Build-only, no credentials -- proves the Dockerfile still builds on
    # every PR and on push, mirroring ghost-platform's mailgun-shim-image.yml
    # split of a credential-free build job and a separate push-and-deploy job.
    # Observed 0.45-0.68min over the last 12 successful runs (p95 0.68min).
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker build \
            --secret id=node_auth_token,env=NODE_AUTH_TOKEN \
            --tag website:ci \
            .

  verify-package-attestations:
    name: Verify package attestations
    runs-on: ubuntu-latest
    # Not yet observed: set from the first run's duration with headroom.
    timeout-minutes: 10
    # Exactly what the action needs: contents to read the lockfile, packages
    # so the run's own token can download a private tarball. No write, no
    # other secret.
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads every pnpm-lock.yaml in the repository. A pinned @branchleft
      # version passes only if it is on the action's list of versions
      # published before attestation began, or carries a signed attestation
      # from the repository and workflow the action's table names for it.
      - name: Verify every locked @branchleft package
        uses: branchLeft/github-workflows/.github/actions/verify-package-attestations@b8beebe6342391ed33570265e910a6e26e48fd62 # v1.2.3

  deploy:
    name: Build, push & deploy
    runs-on: ubuntu-latest
    needs: [checks, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: website-production-deploy
      cancel-in-progress: false
    # packages: write is scoped to this job alone, on the one trigger that
    # ever runs it -- a PR build must never sit in the same permissions block
    # as a publish credential (mailgun-shim-image.yml's reasoning, copied
    # here verbatim).
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    # Observed 1.42-2.88min over the last 5 successful runs (p95 2.88min) --
    # small sample (only push-to-main triggers this job), so a wider margin
    # than the p95-driven jobs above.
    timeout-minutes: 15
    env:
      IMAGE: ghcr.io/branchleft/website
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two tags from one build so `latest` never points at a different layer
      # set than the SHA tag pushed alongside it (mailgun-shim-image.yml's
      # pattern).
      - name: Build and push image
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker build \
            --secret id=node_auth_token,env=NODE_AUTH_TOKEN \
            --tag "$IMAGE:$IMAGE_TAG" \
            --tag "$IMAGE:latest" \
            .
          docker push "$IMAGE" --all-tags

      # branchleft-deploy refuses anything that is not digest-pinned, so a tag
      # is not enough here. `imagetools inspect` has been observed printing a
      # Name:/MediaType:/Digest: block despite --format; the grep yields the
      # bare sha256:... value either way (the same trap shared-infra's
      # RUNBOOK-edge.md documents hitting on 2026-08-22).
      - name: Resolve the pushed image's digest
        id: digest
        run: |
          DIGEST=$(docker buildx imagetools inspect "$IMAGE:$IMAGE_TAG" --format '{{.Manifest.Digest}}' \
            | grep -o 'sha256:[0-9a-f]*' | head -1)
          if [ -z "$DIGEST" ]; then
            echo "::error::could not resolve a digest for $IMAGE:$IMAGE_TAG"
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      # Signs the pushed digest with a keyless GitHub artifact attestation, then
      # verifies it with the identity below and checks that a wrong identity is
      # refused. It sits before every SSH step, so a digest that did not verify
      # never reaches app1. The identity is a literal on purpose: read from this
      # run's own `github.workflow_ref` it would agree with itself and prove
      # nothing. `id-token: write` mints the signing certificate and
      # `attestations: write` stores the attestation; both are granted to this
      # job alone. The same value, with the source ref `refs/heads/main`, is what
      # app1's branchleft-deploy checks once the image is registered there.
      - name: Attest and verify the pushed image
        uses: branchLeft/github-workflows/.github/actions/attest-and-verify-image@231e592397f4c94668c64646c14160d9d497bdde # v1.2.2
        with:
          image: ghcr.io/branchleft/website
          digest: ${{ steps.digest.outputs.digest }}
          signer-workflow: branchLeft/website/.github/workflows/ci.yml
          repo: branchLeft/website

      # The private key never touches disk longer than this job needs it, and
      # never appears in a log: it comes from a secret, not from `run:`
      # interpolation.
      - name: Write the deploy SSH key
        env:
          SSH_KEY: ${{ secrets.HETZNER_APP1_DEPLOY_SSH_KEY }}
        run: |
          install -d -m 0700 ~/.ssh
          umask 077
          printf '%s\n' "$SSH_KEY" > ~/.ssh/app1_deploy_key

      # Pinned rather than TOFU'd: a GitHub-hosted runner has no prior
      # knowledge of app1's host key, and accepting whatever key answers on
      # first connect is exactly the MITM window host-key pinning exists to
      # close.
      - name: Pin app1's host key
        env:
          HETZNER_APP1_SSH_HOST_KEY: ${{ vars.HETZNER_APP1_SSH_HOST_KEY }}
        run: |
          if [ -z "$HETZNER_APP1_SSH_HOST_KEY" ]; then
            echo "HETZNER_APP1_SSH_HOST_KEY is empty or unset -- set the repository variable before deploying" >&2
            exit 1
          fi
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$HETZNER_APP1_SSH_HOST_KEY" >> ~/.ssh/known_hosts

      # The whole of the CI deploy account's privilege: one sudo-permitted
      # binary that validates its own arguments, pins the digest into
      # /etc/branchleft/website.image.env, and restarts branchleft-compose@website
      # (shared-infra's hetzner/provision/branchleft_deploy.py). Nothing here
      # mutates Pulumi state -- there is none left for this stack to mutate.
      - name: Pin app1 to the pushed digest and restart the stack
        env:
          HETZNER_APP1_HOST: ${{ vars.HETZNER_APP1_HOST }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          ssh -i ~/.ssh/app1_deploy_key "deploy@$HETZNER_APP1_HOST" \
            "sudo -n /usr/local/sbin/branchleft-deploy website $IMAGE@$DIGEST"

      # The check runs from this runner against the public name, over HTTPS,
      # through the shared edge. It needs no SSH: the deploy key runs only
      # the deploy above.
      - name: Smoke test the deployed stack at its public name
        run: |
          check() {
            path="$1"
            for attempt in $(seq 1 10); do
              if curl -fsS --max-time 10 "https://branchleft.co.uk$path" -o /dev/null; then
                echo "OK: $path"
                return 0
              fi
              echo "Attempt $attempt failed for $path, retrying in 6s..."
              sleep 6
            done
            echo "::error::Smoke test failed: $path did not return a successful response after retries"
            return 1
          }

          check "/"
          check "/about"
          check "/contact"

      - name: Remove the deploy SSH key
        if: always()
        run: rm -f ~/.ssh/app1_deploy_key
