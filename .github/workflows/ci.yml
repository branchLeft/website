name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No id-token: write at the workflow level any more -- nothing in this
# workflow federates to GCP. Production deploys pin a GHCR image digest onto
# app1 over SSH instead (the `deploy` job below); `packages: write` for that
# job is granted there, not here.
permissions:
  contents: read
  packages: read

jobs:
  checks:
    name: Typecheck, Pre-commit & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: '@branchleft'

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck
        run: pnpm typecheck

      - name: Install infra dependencies
        working-directory: infra
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck infra
        working-directory: infra
        run: npx tsc --noEmit

      - name: Setup Python (for pre-commit)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Run pre-commit hooks
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        env:
          SKIP: vitest

      # Self-test first: a matcher that has quietly stopped matching passes
      # every file, so prove it still works before trusting a pass. The scan
      # then walks the tree rather than taking a list of changed files --
      # pre-commit's `files:` pattern lives in another file and could drift,
      # and a salt that arrived on a branch nobody ran the hook on has to fail
      # here rather than at publication.
      - name: Committed-secret guard
        run: |
          python3 infra/scripts/assert-no-committed-pulumi-secrets.py --self-test
          python3 infra/scripts/assert-no-committed-pulumi-secrets.py --scan-tree .

      - name: Unit tests with coverage
        run: pnpm test:unit --run --coverage
        env:
          CI: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: '@branchleft'

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: End-to-end tests
        run: pnpm test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  docker-build:
    name: docker build (website)
    runs-on: ubuntu-latest
    # Build-only, no credentials -- proves the Dockerfile still builds on
    # every PR and on push, mirroring ghost-platform's mailgun-shim-image.yml
    # split of a credential-free build job and a separate push-and-deploy job.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker build \
            --secret id=node_auth_token,env=NODE_AUTH_TOKEN \
            --tag website:ci \
            .

  deploy:
    name: Build, push & deploy
    runs-on: ubuntu-latest
    needs: [checks, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: website-production-deploy
      cancel-in-progress: false
    # packages: write is scoped to this job alone, on the one trigger that
    # ever runs it -- a PR build must never sit in the same permissions block
    # as a publish credential (mailgun-shim-image.yml's reasoning, copied
    # here verbatim).
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/branchleft/website
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two tags from one build so `latest` never points at a different layer
      # set than the SHA tag pushed alongside it (mailgun-shim-image.yml's
      # pattern).
      - name: Build and push image
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker build \
            --secret id=node_auth_token,env=NODE_AUTH_TOKEN \
            --tag "$IMAGE:$IMAGE_TAG" \
            --tag "$IMAGE:latest" \
            .
          docker push "$IMAGE" --all-tags

      # branchleft-deploy refuses anything that is not digest-pinned, so a tag
      # is not enough here. `imagetools inspect` has been observed printing a
      # Name:/MediaType:/Digest: block despite --format; the grep yields the
      # bare sha256:... value either way (the same trap shared-infra's
      # RUNBOOK-edge.md documents hitting on 2026-08-22).
      - name: Resolve the pushed image's digest
        id: digest
        run: |
          DIGEST=$(docker buildx imagetools inspect "$IMAGE:$IMAGE_TAG" --format '{{.Manifest.Digest}}' \
            | grep -o 'sha256:[0-9a-f]*' | head -1)
          if [ -z "$DIGEST" ]; then
            echo "::error::could not resolve a digest for $IMAGE:$IMAGE_TAG"
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      # The private key never touches disk longer than this job needs it, and
      # never appears in a log: it comes from a secret, not from `run:`
      # interpolation.
      - name: Write the deploy SSH key
        env:
          SSH_KEY: ${{ secrets.HETZNER_APP1_DEPLOY_SSH_KEY }}
        run: |
          install -d -m 0700 ~/.ssh
          umask 077
          printf '%s\n' "$SSH_KEY" > ~/.ssh/app1_deploy_key

      # Pinned rather than TOFU'd: a GitHub-hosted runner has no prior
      # knowledge of app1's host key, and accepting whatever key answers on
      # first connect is exactly the MITM window host-key pinning exists to
      # close.
      - name: Pin app1's host key
        env:
          HETZNER_APP1_SSH_HOST_KEY: ${{ vars.HETZNER_APP1_SSH_HOST_KEY }}
        run: |
          if [ -z "$HETZNER_APP1_SSH_HOST_KEY" ]; then
            echo "HETZNER_APP1_SSH_HOST_KEY is empty or unset -- set the repository variable before deploying" >&2
            exit 1
          fi
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$HETZNER_APP1_SSH_HOST_KEY" >> ~/.ssh/known_hosts

      # The whole of the CI deploy account's privilege: one sudo-permitted
      # binary that validates its own arguments, pins the digest into
      # /etc/branchleft/website.image.env, and restarts branchleft-compose@website
      # (shared-infra's hetzner/provision/branchleft_deploy.py). Nothing here
      # mutates Pulumi state -- there is none left for this stack to mutate.
      - name: Pin app1 to the pushed digest and restart the stack
        env:
          HETZNER_APP1_HOST: ${{ vars.HETZNER_APP1_HOST }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          ssh -i ~/.ssh/app1_deploy_key "deploy@$HETZNER_APP1_HOST" \
            "sudo -n /usr/local/sbin/branchleft-deploy website $IMAGE@$DIGEST"

      # app1's public port is bound to its private address only
      # (deploy/compose.yml) -- nothing listens on loopback, so the check
      # runs on the host itself, over the one SSH account CI holds, against
      # that same private address.
      - name: Smoke test the deployed stack over the private network
        env:
          HETZNER_APP1_HOST: ${{ vars.HETZNER_APP1_HOST }}
        run: |
          check() {
            path="$1"
            for attempt in $(seq 1 10); do
              if ssh -i ~/.ssh/app1_deploy_key "deploy@$HETZNER_APP1_HOST" \
                   "curl -fsS --max-time 10 http://10.20.1.100:8080$path -o /dev/null"; then
                echo "OK: $path"
                return 0
              fi
              echo "Attempt $attempt failed for $path, retrying in 6s..."
              sleep 6
            done
            echo "::error::Smoke test failed: $path did not return a successful response after retries"
            return 1
          }

          check "/"
          check "/about"
          check "/contact"

      - name: Remove the deploy SSH key
        if: always()
        run: rm -f ~/.ssh/app1_deploy_key
