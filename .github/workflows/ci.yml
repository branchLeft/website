name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No id-token: write at the workflow level any more -- nothing in this
# workflow federates to GCP. Production deploys pin a GHCR image digest onto
# app1 over SSH instead (the `deploy` job below); `packages: write` for that
# job is granted there, not here.
permissions:
  contents: read
  packages: read

jobs:
  checks:
    name: Typecheck, Pre-commit & Coverage
    runs-on: ubuntu-latest
    # Observed 0.77-1.1min over the last 20 successful runs (p95 1.08min).
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: '@branchleft'

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck
        run: pnpm typecheck

      - name: Setup Python (for pre-commit)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'

      - name: Run pre-commit hooks
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        env:
          SKIP: vitest

      - name: Unit tests with coverage
        run: pnpm test:unit --run --coverage
        env:
          CI: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    # Observed 2.05-2.72min over the last 20 successful runs (p95 2.55min).
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: '@branchleft'

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: End-to-end tests
        run: pnpm test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  docker-build:
    name: docker build (website)
    runs-on: ubuntu-latest
    # Build-only, no credentials -- proves the Dockerfile still builds on
    # every PR and on push, mirroring ghost-platform's mailgun-shim-image.yml
    # split of a credential-free build job and a separate push-and-deploy job.
    # Observed 0.45-0.68min over the last 12 successful runs (p95 0.68min).
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker build \
            --secret id=node_auth_token,env=NODE_AUTH_TOKEN \
            --tag website:ci \
            .

  deploy:
    name: Build, push & deploy
    runs-on: ubuntu-latest
    needs: [checks, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: website-production-deploy
      cancel-in-progress: false
    # packages: write is scoped to this job alone, on the one trigger that
    # ever runs it -- a PR build must never sit in the same permissions block
    # as a publish credential (mailgun-shim-image.yml's reasoning, copied
    # here verbatim). id-token: write and attestations: write let the run
    # sign the pushed digest with a keyless artifact attestation (the attest
    # step below); they are held by this job alone for the same reason.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    # Observed 1.42-2.88min over the last 5 successful runs (p95 2.88min) --
    # small sample (only push-to-main triggers this job), so a wider margin
    # than the p95-driven jobs above.
    timeout-minutes: 15
    env:
      IMAGE: ghcr.io/branchleft/website
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two tags from one build so `latest` never points at a different layer
      # set than the SHA tag pushed alongside it (mailgun-shim-image.yml's
      # pattern).
      - name: Build and push image
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker build \
            --secret id=node_auth_token,env=NODE_AUTH_TOKEN \
            --tag "$IMAGE:$IMAGE_TAG" \
            --tag "$IMAGE:latest" \
            .
          docker push "$IMAGE" --all-tags

      # branchleft-deploy refuses anything that is not digest-pinned, so a tag
      # is not enough here. `imagetools inspect` has been observed printing a
      # Name:/MediaType:/Digest: block despite --format; the grep yields the
      # bare sha256:... value either way (the same trap shared-infra's
      # RUNBOOK-edge.md documents hitting on 2026-08-22).
      - name: Resolve the pushed image's digest
        id: digest
        run: |
          DIGEST=$(docker buildx imagetools inspect "$IMAGE:$IMAGE_TAG" --format '{{.Manifest.Digest}}' \
            | grep -o 'sha256:[0-9a-f]*' | head -1)
          if [ -z "$DIGEST" ]; then
            echo "::error::could not resolve a digest for $IMAGE:$IMAGE_TAG"
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      # The image is signed and the signature proven BEFORE anything reaches
      # app1, so an image that fails here is never offered to the host. Each of
      # the next four steps has no `if:` and no `continue-on-error`: none can be
      # skipped or waved through. The host then checks the same attestation
      # again, with the same identity, before it pins the digest
      # (branchleft-deploy refuses a registered image it cannot verify).
      #
      # The verifier scripts are ghost-platform's, the one home of the check a
      # host runs, fetched at a pinned commit rather than copied here so the two
      # cannot drift. Only scripts/ is fetched; nothing from it is built or
      # pushed, and no credential is persisted into the checkout.
      - name: Fetch the attestation verifier scripts at a pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: branchLeft/ghost-platform
          ref: 653c21e04190f19f5c15ed329c01e17e989e64ea
          path: .attest-tools
          sparse-checkout: scripts
          persist-credentials: false

      # Keyless: the signing certificate is minted from this run's own OIDC
      # token and logged in Sigstore's public-good instance. No key, secret or
      # paid service. The bundle is stored beside the image in the registry, so
      # a host verifies with `--bundle-from-oci` and holds no GitHub token.
      - name: Attest the pushed image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
          # Storage records need `artifact-metadata: write`, which nothing here uses.
          create-storage-record: false

      # The same script a host runs. The identity is a literal on purpose: read
      # from this run's own `github.workflow_ref` it would agree with itself
      # and prove nothing. It is the value registered for this image on the
      # host, with the source ref refs/heads/main. The attestation can take a
      # moment to reach the API and the registry, so a failed verify is retried
      # (five attempts, 12, 24, 36 and 48 seconds apart); only the last failure
      # is annotated, so a retry that succeeds leaves no red mark.
      - name: Verify the attestation through the GitHub API and from the registry
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.digest.outputs.digest }}
          REPO: branchLeft/website
          SIGNER_WORKFLOW: branchLeft/website/.github/workflows/ci.yml
        run: |
          verify() {
            label="$1"
            shift
            for attempt in 1 2 3 4 5; do
              echo "Verify $label, attempt $attempt of 5"
              if [ "$attempt" -lt 5 ]; then plain=1; else plain=0; fi
              if VERIFY_PLAIN_ERRORS="$plain" .attest-tools/scripts/verify-image-attestation.sh \
                   "$IMAGE@$DIGEST" "$REPO" "$SIGNER_WORKFLOW" "$@"; then
                return 0
              fi
              if [ "$attempt" -lt 5 ]; then
                pause=$((attempt * 12))
                echo "Attempt $attempt failed. Waiting ${pause}s before the next attempt."
                sleep "$pause"
              fi
            done
            echo "::error::the attestation did not verify $label in 5 attempts"
            return 1
          }
          verify "through the GitHub API"
          verify "from the registry bundle" --bundle-from-oci

      # Sabotage control, run on every deploy. The step above just accepted this
      # exact image with the right identity. This one requires a wrong identity
      # to be refused, and refused for the identity: a network, TUF or registry
      # fault also exits non-zero and fails the job rather than passing as a
      # rejection. If a wrong identity is accepted the verify proves nothing,
      # and this step fails the job too.
      - name: Prove a wrong identity is rejected
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          .attest-tools/scripts/prove-wrong-identity-rejected.sh \
            "$IMAGE@$DIGEST" branchLeft/website branchLeft/website/.github/workflows/ci.yml

      # The private key never touches disk longer than this job needs it, and
      # never appears in a log: it comes from a secret, not from `run:`
      # interpolation.
      - name: Write the deploy SSH key
        env:
          SSH_KEY: ${{ secrets.HETZNER_APP1_DEPLOY_SSH_KEY }}
        run: |
          install -d -m 0700 ~/.ssh
          umask 077
          printf '%s\n' "$SSH_KEY" > ~/.ssh/app1_deploy_key

      # Pinned rather than TOFU'd: a GitHub-hosted runner has no prior
      # knowledge of app1's host key, and accepting whatever key answers on
      # first connect is exactly the MITM window host-key pinning exists to
      # close.
      - name: Pin app1's host key
        env:
          HETZNER_APP1_SSH_HOST_KEY: ${{ vars.HETZNER_APP1_SSH_HOST_KEY }}
        run: |
          if [ -z "$HETZNER_APP1_SSH_HOST_KEY" ]; then
            echo "HETZNER_APP1_SSH_HOST_KEY is empty or unset -- set the repository variable before deploying" >&2
            exit 1
          fi
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$HETZNER_APP1_SSH_HOST_KEY" >> ~/.ssh/known_hosts

      # The whole of the CI deploy account's privilege: one sudo-permitted
      # binary that validates its own arguments, pins the digest into
      # /etc/branchleft/website.image.env, and restarts branchleft-compose@website
      # (shared-infra's hetzner/provision/branchleft_deploy.py). Nothing here
      # mutates Pulumi state -- there is none left for this stack to mutate.
      - name: Pin app1 to the pushed digest and restart the stack
        env:
          HETZNER_APP1_HOST: ${{ vars.HETZNER_APP1_HOST }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          ssh -i ~/.ssh/app1_deploy_key "deploy@$HETZNER_APP1_HOST" \
            "sudo -n /usr/local/sbin/branchleft-deploy website $IMAGE@$DIGEST"

      # app1's public port is bound to its private address only
      # (deploy/compose.yml) -- nothing listens on loopback, so the check
      # runs on the host itself, over the one SSH account CI holds, against
      # that same private address.
      - name: Smoke test the deployed stack over the private network
        env:
          HETZNER_APP1_HOST: ${{ vars.HETZNER_APP1_HOST }}
        run: |
          check() {
            path="$1"
            for attempt in $(seq 1 10); do
              if ssh -i ~/.ssh/app1_deploy_key "deploy@$HETZNER_APP1_HOST" \
                   "curl -fsS --max-time 10 http://10.20.1.100:8080$path -o /dev/null"; then
                echo "OK: $path"
                return 0
              fi
              echo "Attempt $attempt failed for $path, retrying in 6s..."
              sleep 6
            done
            echo "::error::Smoke test failed: $path did not return a successful response after retries"
            return 1
          }

          check "/"
          check "/about"
          check "/contact"

      - name: Remove the deploy SSH key
        if: always()
        run: rm -f ~/.ssh/app1_deploy_key
