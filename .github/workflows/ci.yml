name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read
  id-token: write

jobs:
  checks:
    name: Typecheck, Pre-commit & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: '@branchleft'

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck
        run: pnpm typecheck

      - name: Install infra dependencies
        working-directory: infra
        run: npm ci

      - name: Typecheck infra
        working-directory: infra
        run: npx tsc --noEmit

      - name: Setup Python (for pre-commit)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Run pre-commit hooks
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        env:
          SKIP: vitest

      - name: Unit tests with coverage
        run: pnpm test:unit --run --coverage
        env:
          CI: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: '@branchleft'

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: End-to-end tests
        run: pnpm test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  pulumi-preview:
    name: Pulumi preview
    runs-on: ubuntu-latest
    needs: [checks, e2e]
    if: github.event_name == 'pull_request'
    # Job-level permissions replace the workflow-level block entirely — every
    # scope this job needs must be listed here, not just the added one.
    # Omitting packages: read fails the Docker build with a 403 fetching
    # @branchleft/components from npm.pkg.github.com, a long way from
    # anything that looks permissions-related.
    #
    # pull-requests: write is the scope actually being added; without it
    # github.rest.issues.createComment fails with "Resource not accessible
    # by integration". It has no effect on PRs from forks, where GITHUB_TOKEN
    # is read-only whatever this block says — which is why the comment steps
    # below are best-effort and the job summary is the real output.
    permissions:
      contents: read
      packages: read
      id-token: write
      pull-requests: write
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPO }}/website:${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for relevant file changes
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- infra Dockerfile .github/workflows/ci.yml | grep -q .; then
            echo "infra=true" >> "$GITHUB_OUTPUT"
          else
            echo "infra=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post fork comment
        # Best-effort: a fork PR's GITHUB_TOKEN is read-only, so this is the
        # one case where it is guaranteed to fail. Must not fail the check.
        continue-on-error: true
        if: github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## Pulumi Preview\n\nSkipped — fork PR, no infrastructure credentials available. This check is only available for PRs from the main repository.'
            });

      - name: Authenticate to GCP (Workload Identity Federation)
        if: |
          github.event.pull_request.head.repo.full_name == github.repository &&
          steps.paths.outputs.infra == 'true'
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA_EMAIL }}

      - name: Set up gcloud
        if: |
          github.event.pull_request.head.repo.full_name == github.repository &&
          steps.paths.outputs.infra == 'true'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Configure Docker for Artifact Registry
        if: |
          github.event.pull_request.head.repo.full_name == github.repository &&
          steps.paths.outputs.infra == 'true'
        env:
          GCP_REGION: ${{ vars.GCP_REGION }}
        run: gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet

      - name: Set up Docker Buildx
        if: |
          github.event.pull_request.head.repo.full_name == github.repository &&
          steps.paths.outputs.infra == 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push image
        if: |
          github.event.pull_request.head.repo.full_name == github.repository &&
          steps.paths.outputs.infra == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          secrets: |
            node_auth_token=${{ secrets.GITHUB_TOKEN }}

      - name: Install Pulumi CLI
        if: |
          github.event.pull_request.head.repo.full_name == github.repository &&
          steps.paths.outputs.infra == 'true'
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0

      - name: Install infra dependencies
        if: |
          github.event.pull_request.head.repo.full_name == github.repository &&
          steps.paths.outputs.infra == 'true'
        working-directory: infra
        run: npm ci

      - name: Run Pulumi preview
        if: |
          github.event.pull_request.head.repo.full_name == github.repository &&
          steps.paths.outputs.infra == 'true'
        working-directory: infra
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          pulumi login gs://branchleft-pulumi-state
          pulumi stack select production
          pulumi config set imageTag "$IMAGE_TAG"
          pulumi preview > preview-output.txt 2>&1

      # The job summary is the authoritative output: it needs no token
      # permissions, so it works on fork PRs where the PR comment cannot.
      - name: Write preview to job summary
        if: steps.paths.outputs.infra == 'true'
        run: |
          {
            echo '## Pulumi Preview'
            echo
            echo '```'
            cat infra/preview-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post preview as PR comment
        # Best-effort: a fork PR's read-only GITHUB_TOKEN cannot comment, and
        # that must not fail the check. The job summary above always has it.
        continue-on-error: true
        if: |
          github.event.pull_request.head.repo.full_name == github.repository &&
          steps.paths.outputs.infra == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const previewPath = 'infra/preview-output.txt';
            let previewOutput = 'No preview output captured';
            if (fs.existsSync(previewPath)) {
              previewOutput = fs.readFileSync(previewPath, 'utf8');
            }
            // GitHub rejects comment bodies over 65536 characters. Keep the
            // tail rather than the head: the resource list and the "N to
            // create / M to update" summary are at the end, and they are the
            // part worth reading.
            const LIMIT = 60000;
            let truncated = false;
            if (previewOutput.length > LIMIT) {
              previewOutput = previewOutput.slice(-LIMIT);
              truncated = true;
            }
            const note = truncated
              ? '\n\n_Output truncated to the last ' + LIMIT + ' characters; see the job log for the full preview._'
              : '';
            const comment = '## Pulumi Preview\n\n```\n' + previewOutput + '\n```' + note;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Post no-changes comment
        continue-on-error: true
        if: |
          github.event.pull_request.head.repo.full_name == github.repository &&
          steps.paths.outputs.infra == 'false'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## Pulumi Preview\n\nSkipped — no infrastructure or deployment files changed.'
            });

      # Runs last, after the summary/comment steps above have already posted
      # the full preview — so the failure below never hides that output. This
      # is a real signal, not a guess: it parses the actual preview that ran
      # against production state with real GCP credentials a few steps up.
      # It is not a substitute for the merge gate described in the PR that
      # introduced it (a separate private infrastructure repo now owns these
      # resources via a Pulumi state move) — this repo's branch protection
      # allows an admin to bypass required checks, so treat a green run here
      # as one more piece of evidence, not a guarantee.
      - name: Fail if the edge load balancer would be deleted
        if: |
          github.event.pull_request.head.repo.full_name == github.repository &&
          steps.paths.outputs.infra == 'true'
        working-directory: infra
        run: |
          # Self-test first: prove the matcher still matches real preview
          # output before trusting a pass from it. A checker that silently
          # stops matching reports success and blocks nothing.
          python3 scripts/assert-no-edge-deletes.py --self-test
          python3 scripts/assert-no-edge-deletes.py preview-output.txt

  deploy:
    name: Build, push & deploy
    runs-on: ubuntu-latest
    needs: [checks, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: pulumi-production-deploy
      cancel-in-progress: false
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPO }}/website:${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate to GCP (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Configure Docker for Artifact Registry
        env:
          GCP_REGION: ${{ vars.GCP_REGION }}
        run: gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          secrets: |
            node_auth_token=${{ secrets.GITHUB_TOKEN }}

      - name: Install Pulumi CLI
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0

      - name: Install infra dependencies
        working-directory: infra
        run: npm ci

      - name: Deploy with Pulumi
        working-directory: infra
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          pulumi login gs://branchleft-pulumi-state
          pulumi stack select production
          pulumi config set imageTag "$IMAGE_TAG"

          # Preflight: this deploy must never delete the edge load balancer.
          # It moved to a separate private infrastructure repo via a Pulumi
          # state move (see that repo's runbook); until that move completes,
          # this stack's state still holds all 17 edge resources while this
          # program no longer declares any of them, and an unguarded
          # `pulumi up` would delete them — including the reserved anycast
          # IP, which does not come back. This check has real, authenticated
          # access to the same state `pulumi up` is about to act on, so a
          # pass here is a genuine guarantee for this run, not an assumption.
          pulumi preview > preflight-preview.txt 2>&1

          # Self-test first: prove the matcher still matches real preview
          # output before trusting a pass from it. A checker that silently
          # stops matching reports success and blocks nothing.
          python3 scripts/assert-no-edge-deletes.py --self-test
          if ! python3 scripts/assert-no-edge-deletes.py preflight-preview.txt; then
            cat preflight-preview.txt
            exit 1
          fi

          pulumi up --yes

      # `pulumi up` succeeding only means the API call to update the Cloud
      # Run service returned OK — it does not confirm the new revision is
      # actually serving traffic without errors (e.g. booting then 500ing
      # on every request). Hit the live site directly, with retries to
      # absorb cold start / DNS-level propagation, and fail the job loudly
      # if it doesn't come up healthy.
      - name: Smoke test deployed site
        run: |
          check() {
            url="$1"
            for attempt in $(seq 1 10); do
              if curl -fsS --max-time 10 "$url" -o /dev/null; then
                echo "OK: $url"
                return 0
              fi
              echo "Attempt $attempt failed for $url, retrying in 6s..."
              sleep 6
            done
            echo "::error::Smoke test failed: $url did not return a successful response after retries"
            return 1
          }

          check "https://branchleft.co.uk/"
          check "https://branchleft.co.uk/about"
          check "https://branchleft.co.uk/contact"
