name: graphify

on:
  push:
    branches: [main]
    paths-ignore:
      - 'graphify-out/**'
  workflow_dispatch: {}

jobs:
  graphify:
    # The org default caps a reusable workflow at contents: read, and it cannot
    # grant itself more than the caller allows.
    permissions:
      contents: write
    uses: branchLeft/github-workflows/.github/workflows/graphify.yml@v1.0.3
    secrets: inherit
