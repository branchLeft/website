allowBuilds:
  '@parcel/watcher': false
  esbuild: false
# NOTE: minimumReleaseAge is NOT set in this repo, so no publish-age cooldown is enforced and
# this exclude list has no effect today (`pnpm config get minimumReleaseAge` returns undefined).
# Setting a cooldown is a separate supply-chain policy decision, not made here.
# The @branchleft scope is listed so that a future cooldown would not gate first-party releases.
minimumReleaseAgeExclude:
  - '@branchleft/*'
# Transitive packages whose critical or high findings have a published fix (Grype, 2026-11-10).
overrides:
  proxy-addr: 2.0.8
  body-parser: 2.4.0
  compression: 1.8.2
  source-map-js: 1.2.2
  zod: 4.6.6
  'undici@8': 8.12.2
  'brace-expansion@1': 1.1.21
